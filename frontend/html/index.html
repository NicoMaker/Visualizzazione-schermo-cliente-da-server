<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <title>Desktop Remoto</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖥️%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body class="page-center">
    <main class="card card-narrow">
      <div class="logo">🖥️</div>
      <h1>Desktop Remoto</h1>
      <p class="muted">
        Assistenza remota attiva.<br />Per farti aiutare apri il
        <strong>link di accesso</strong> che ti ha dato il tecnico e inserisci
        il <strong>codice</strong> che ti comunica.
      </p>
      <ol class="steps">
        <li>Apri il <strong>link</strong> che ti ha mandato il tecnico</li>
        <li>Scrivi il <strong>codice a 6 cifre</strong></li>
        <li>Scegli tu <strong>cosa condividere</strong> e conferma</li>
      </ol>
      <a class="btn primary block" id="hostLink" href="/host" hidden
        >Apri il pannello host</a
      >
    </main>
    <script src="/static/js/index.js"></script>
  </body>
</html>
