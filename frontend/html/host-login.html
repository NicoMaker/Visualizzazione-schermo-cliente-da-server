<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <title>Accesso host · Desktop Remoto</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖥️%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body class="page-center">
    <main class="card card-narrow">
      <div class="logo">🛡️</div>
      <h1>Pannello host</h1>
      <p class="muted">
        Inserisci la <strong>password</strong> per vedere lo schermo dei clienti
        da questo dispositivo.
      </p>

      <form id="hostForm" autocomplete="off" novalidate>
        <input
          id="pwd"
          class="text-input"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          aria-label="Password pannello host"
          autofocus
        />
        <button id="submitBtn" class="btn primary block" type="submit">
          Entra nel pannello
        </button>
        <p id="msg" class="msg" role="alert" hidden></p>
      </form>
      <a class="btn ghost block" href="/">Torna alla pagina iniziale</a>
    </main>
    <script src="/static/js/host-login.js"></script>
  </body>
</html>
